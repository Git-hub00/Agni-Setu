  /api/v1/applications/{application_id}/require-inspection:
    post:
      operationId: applications_require_inspection_create
      description: API-029 (case-level command).
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/resolve-routing:
    post:
      operationId: applications_resolve_routing_create
      description: API-028.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/return-review:
    post:
      operationId: applications_return_review_create
      description: API-063 / TR-14.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/revisions:
    get:
      operationId: applications_revisions_retrieve
