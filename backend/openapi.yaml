      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/start-scrutiny:
    post:
      operationId: applications_start_scrutiny_create
      description: API-027 / TR-02.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
