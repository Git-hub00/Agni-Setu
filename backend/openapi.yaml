      parameters:
      - in: path
        name: certificate_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - certificates
      responses:
        '200':
          description: No response body
  /api/v1/certificates/{certificate_id}/access:
    post:
      operationId: certificates_access_create
      description: |-
        API-069: reauthorise the reader, audit, and issue a short-lived principal-bound ticket
