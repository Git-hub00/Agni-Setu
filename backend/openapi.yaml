openapi: 3.0.3
info:
  title: Agni Setu API
  version: 0.1.0
  description: 'Fire-safety certificate case management. Contracts: docs/06_API_AND_EVENT_CONTRACTS.md'
paths:
  /api/v1/appeals:
    post:
      operationId: appeals_create
      description: |-
        API-117: disabled until an approved appeal profile exists. Answers with the referral
        route; no appeal record is created and the source decision is untouched.
      tags:
      - appeals
      responses:
        '200':
          description: No response body
  /api/v1/appeals/{appeal_id}/decisions:
    post:
      operationId: appeals_decisions_create
      description: |-
        API-117: disabled until an approved appeal profile exists. Answers with the referral
        route; no appeal record is created and the source decision is untouched.
      parameters:
      - in: path
        name: appeal_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appeals
      responses:
        '200':
          description: No response body
  /api/v1/applications:
    get:
      operationId: applications_retrieve
      description: API-020 list (scope before filter/count; stable cursor) and API-021
        create.
      tags:
      - applications
      responses:
        '200':
          description: No response body
    post:
      operationId: applications_create
      description: API-020 list (scope before filter/count; stable cursor) and API-021
        create.
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}:
    get:
      operationId: applications_retrieve_2
      description: 'API-022: canonical detail with allowed actions and safe blockers.'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/complete-corrections:
    post:
      operationId: applications_complete_corrections_create
      description: API-061.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/decision-readiness:
    get:
      operationId: applications_decision_readiness_retrieve
      description: |-
        API-064: the server-calculated guard list for the current supervisor. The read result
        never authorises the later command by itself.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/decisions:
    get:
      operationId: applications_decisions_retrieve
      description: 'API-066 (GET: published decision plus authorised internal context)
        and API-065 (POST).'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
    post:
      operationId: applications_decisions_create
      description: 'API-066 (GET: published decision plus authorised internal context)
        and API-065 (POST).'
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/draft:
    patch:
      operationId: applications_draft_partial_update
      description: |-
        All project endpoints extend this. Unsafe methods require a valid CSRF token even when
        no session exists (login/OTP endpoints are not exempt).
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/external-registration:
    post:
      operationId: applications_external_registration_create
      description: |-
        API-072 external registration and API-119 continuing declarations are profile-gated
        (integrations s.9, s.8). The demo profile does not enable them: the route exists, answers
        409 SERVICE_DISABLED with the approved referral wording and creates nothing.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/findings:
    get:
      operationId: applications_findings_retrieve
      description: API-059.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/holds:
    post:
      operationId: applications_holds_create
      description: API-031.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
  /api/v1/applications/{application_id}/notices:
    get:
      operationId: applications_notices_retrieve
      description: API-053 (GET) and API-054 (POST) on the case.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
    post:
      operationId: applications_notices_create
      description: API-053 (GET) and API-054 (POST) on the case.
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      responses:
        '200':
          description: No response body
