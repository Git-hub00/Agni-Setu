const FAQ=[['What is a draft, and when is an application received?','A draft is editable work in progress. It enters the received workload only after all required fields, documents and declarations pass the demonstration submission checks. The accepted receipt and policy snapshot then appear in its timeline.'],['How do I respond to a notice?','Open the application and select Notices & responses. Respond to each item with a correction note and evidence. A submitted response does not close a finding; an authorized reviewer must verify it or arrange another inspection.'],['Does an overdue target reject my application?','No. A demonstration target creates a reminder or escalation. It never creates an automatic safety decision. Changing the assigned officer or rescheduling a visit does not reset that target.'],['How does offline field work behave?','Open an assigned inspection, then use Simulate offline. Draft observations are stored in this browser. A completed report can be queued locally. Reconnect and open Offline & sync to submit it. The accepted version and current assignment are checked before acceptance. This single HTML file is not an installable production PWA.'],['How can I verify a certificate?','Use the public verification screen and enter a sample certificate identifier. The result separates active, expired, revoked, not found and unverifiable records. No private contact data or building documents are shown. Every instrument in this prototype is non-official.'],['Who can approve a case or publish a policy?','Only the Supervisor demo persona has the fictional case-decision delegation. Operations administrators can recover jobs, but cannot decide cases. Administrators prepare policy versions; the separate Policy approver persona reviews and publishes them.'],['Where are the mock data and uploaded files stored?','Application changes are stored in this browser using local storage. File bytes are stored in IndexedDB where available, with a session-only fallback. function acceptOperation(op){if(op.status==='SYNCED')return {ok:true,repeated:true};const a=caseBy(op.caseId);if(!a||a.officer!==op.officer||!staff(op.officer)?.active){op.status='REJECTED';op.error='Assignment or actor authority is no longer valid. Local evidence is retained.';save();return {ok:false,error:op.error}}if(a.state!=='INSPECTION_PENDING'||!['SCHEDULED','IN_PROGRESS'].includes(a.attempts.at(-1)?.status)){op.status='REJECTED';op.error='The accepted case no longer permits inspection submission. Refresh the case; local evidence is retained.';save();return {ok:false,error:op.error}}if(a.version!==op.baseVersion){op.status='CONFLICT';op.error='Accepted case v'+a.version+' differs from draft base v'+op.baseVersion+'. Review before rebasing.';save();return {ok:false,error:op.error}}

function submitReport(id){const a=readCase(id);if(!guard(a&&canInspect(a)))return;const d=ensureReport(a),err=validateReport(d);if(err){document.getElementById('report-error').textContent=err;document.getElementById('report-error').scrollIntoView({behavior:'smooth',block:'center'});toast(err,'error');return}let op=DB.sync.find(x=>x.id===d.operationId);if(op?.status==='SYNCED'){toast('This report was already accepted.');go('/applications/'+id);return}if(!op){op={id:d.operationId,caseId:id,officer:DB.officer,baseVersion:d.baseVersion,status:'QUEUED',type:'REPORT',created:DB.clock,payload:clone(d),error:''};DB.sync.unshift(op)}else{op.payload=clone(d);op.baseVersion=d.baseVersion;op.status='QUEUED';op.error=''}save();if(DB.settings.offline){go('/sync');toast('Report queued locally. The accepted case has not changed.');return}const result=acceptOperation(op);if(result.ok){go('/applications/'+id+'?tab=inspection');toast('Inspection report accepted once. The case is ready for review.');}else{go('/sync');toast(result.error,'error')}}

function policySimulation(version){const p=DB.policies.find(p=>p.version===Number(version));if(!p)return;const budgetOK=Object.values(p.targets).every(h=>Number.isInteger(h)&&h>0&&h<=720),mandatory=p.checklist.filter(q=>q.mandatory),fixture={profile:p.version,findings:[],report:{items:p.checklist.map(q=>({id:q.id,status:'PASS',note:'Synthetic scenario observation.',evidence:[]}))}},failed=clone(fixture),unknown=clone(fixture);if(mandatory.length){failed.report.items.find(q=>q.id===mandatory[0].id).status='FAIL';unknown.report.items.find(q=>q.id===mandatory[0].id).status='NOT_VERIFIED';}const checks=[['Complete evidence',mandatory.length>0&&blockers(fixture).length===0,'All mandatory PASS observations permit a human review, not automatic approval.'],['Mandatory failure',mandatory.length>0&&blockers(failed).length>0,'One unresolved mandatory failure blocks favorable completion.'],['Unknown observation',mandatory.length>0&&blockers(unknown).length>0,'NOT_VERIFIED does not count as PASS.'],['Target bounds',budgetOK,'Every target is a positive whole number of at most 720 demo hours.'],['Existing policy snapshots',DB.cases.filter(a=>a.receipt).every(a=>DB.policies.some(x=>x.version===a.profile)),'Every received case retains a known immutable policy reference.']];p.simulated=checks.every(x=>x[1]);p.simulatedAt=DB.clock;audit('Policy scenario checks run','','Demonstration package v'+p.version+' / '+checks.filter(x=>x[1]).length+' of '+checks.length+' checks.');save();showDialog('Policy scenario checks','<p class="small muted mb16">These are deterministic prototype checks of the sample policy model, not legal validation or a production QA certification.</p>'+checks.map(([title,pass,reason])=>'<div class="note-card"><div class="between"><h3>'+title+'</h3>'+tag(pass?'Passed':'Needs correction',pass?'green':'red')+'</div><p>'+reason+'</p></div>').join(''),btn('Done','close-dialog','check','primary'),{size:'large'});}

function aboutDialog(){showDialog('About this product prototype','<div class="flex mb16"><span class="brand-mark">'+icon('flame')+'</span><h2>Agni Setu</h2>'+tag('Design prototype v1.0','orange')+'</div><p class="small muted" style="line-height:1.9">A self-contained, browser-local implementation of the business journeys described in <strong>Agni Setu - Project Specification, AGNISETU-SP-001 v1.0, 06 September 2026</strong>: accountable intake, inspection evidence, notices, controlled decisions, publication and verification.</p><div class="divider"></div><h3>Working in this file</h3><p class="small muted mt8" style="line-height:1.9">Role-aware navigation, searchable records, saved drafts, mock uploads, scheduling, checklist validation, field synchronization, conflict handling, reminders, escalation, decision guards, sample certificates, policy approval, support and exports all share the same local data model.</p><div class="divider"></div><h3>What remains simulated</h3><p class="small muted mt8" style="line-height:1.9">Authentication and OTP, server authorization, antivirus scanning, GPS, signing, providers, background work and cross-device persistence. There is no live government connection or approved statutory policy. Local storage is not a protected database. File downloads and print-to-PDF use the browser.</p><div class="mt24">'+info('Every person, premises, target, jurisdiction mapping and certificate is fictional. Do not use this prototype with confidential data or to make a real fire-safety decision.','warning')+'</div>',btn('Close','close-dialog')+btn('Open walkthrough','tour','play','primary'),{size:'large'});}

function expectCase(fd,states,role='supervisor'){const a=readCase(fd.get('caseId'));if(!a||DB.role!==role||!states.includes(a.state)){modalError('This action is not permitted for the current role or case stage.');return null}if(fd.has('version')&&a.version!==Number(fd.get('version'))){modalError('The case changed while this dialog was open. Close it and review the latest version before retrying.');return null}return a}
function reasonableText(value,min=5){return String(value||'').trim().length>=min}
async function submitForm(form){const fd=new FormData(form),id=form.id;if(!form.reportValidity())return;
 if(id==='wizard-form'){if(wizardStep===2&&docKeys(wizardDraft.category).some(k=>!wizardDraft.documents.some(d=>d.key===k&&d.scan==='CLEAN'))){document.getElementById('wizard-error').textContent='Attach all required files before continuing.';return}if(wizardStep<3){wizardStep++;persistDraft();render();window.scrollTo({top:0,behavior:'smooth'});}else submitDraft();return}
 if(id==='verify-form'){go('/verify?code='+encodeURIComponent(String(fd.get('code')).trim().toUpperCase()));return}
 if(id==='auth-form'){if(form.dataset.register==='true'){DB.profile={name:String(fd.get('name')).trim(),email:String(fd.get('email')).trim()};audit('Demo applicant profile created','','Applicant-only access; no live registration.');save();setRole('applicant');toast('Fictional applicant profile created. Staff permissions are not granted.');}else if(authStep!=='otp'){authEmail=String(fd.get('email'));authStep='otp';render();}else{if(fd.get('otp')!=='123456'){document.getElementById('auth-error').textContent='Enter the demonstration code 123456. No real OTP is required.';return}authStep='contact';setRole('applicant');toast('Applicant demonstration workspace opened.');}return}
 if(id==='routing-form'){const a=expectCase(fd,['SUBMITTED']);if(!a)return;if(!reasonableText(fd.get('reason'))){modalError('Record a meaningful mapping reason.');return}a.routingResolution={previousWard:a.ward,resolvedTo:fd.get('ward'),reason:fd.get('reason'),mappingVersion:1,at:DB.clock};a.ward=String(fd.get('ward'));a.routingException=false;a.version++;event(a,'Routing exception resolved',String(fd.get('reason')));save();closeDialog();render();toast('Routing resolved. The received revision and original clocks are retained.');return}
 if(id==='schedule-form'){const a=expectCase(fd,['SCRUTINY','INSPECTION_PENDING','COMPLIANCE_PENDING']);if(!a)return;const p=staff(fd.get('officer'));if(!p?.active||p.role!=='Inspection officer'){modalError('Choose an eligible active inspection actor.');return}const start=Date.parse(fd.get('date')+'T'+fd.get('time')+':00+05:30'),end=start+Number(fd.get('duration'))*60000;if(!Number.isFinite(start)||start<now()){modalError('Choose a future appointment in the demonstration clock.');return}if(!reasonableText(fd.get('reason'))){modalError('Provide the visit purpose or a meaningful change reason.');return}const conflict=DB.cases.some(x=>x.id!==a.id&&x.attempts.some(t=>t.officer===p.id&&['SCHEDULED','IN_PROGRESS'].includes(t.status)&&Date.parse(t.scheduled)<end&&Date.parse(t.end)>start));if(conflict){modalError('This officer already has an overlapping appointment. Choose another time or actor.');return}const old=a.attempts.at(-1);if(old&&['SCHEDULED','IN_PROGRESS'].includes(old.status)){old.status='CANCELLED';old.cancelledAt=DB.clock;old.cancelReason=String(fd.get('reason'))}const previous=a.officer;a.officer=p.id;a.attempts.push({id:newID('VISIT'),no:a.attempts.length+1,status:'SCHEDULED',officer:p.id,scheduled:timeISO(start),end:timeISO(end),reason:String(fd.get('reason')),location:a.address});const st=stageObligation(a);if(st&&st.stage==='INSPECTION_PENDING')st.owner=p.name;
 if(a.state!=='INSPECTION_PENDING')transition(a,'INSPECTION_PENDING',fd.get('reinspect')==='yes'?'Reinspection ordered':'Inspection scheduled','Assigned to '+p.name+' on '+dt(timeISO(start),'full')+' IST. '+String(fd.get('reason')));else{a.version++;event(a,previous!==p.id?'Inspection reassigned':'Inspection rescheduled','Assigned to '+p.name+' on '+dt(timeISO(start),'full')+' IST. '+String(fd.get('reason')));notify(a,'Inspection appointment updated',dt(timeISO(start),'full')+' IST. Existing targets continue.');save();}closeDialog();render();toast('Appointment recorded. Existing visit history is retained.');return}
 if(id==='info-request-form'){const a=expectCase(fd,['SCRUTINY']);if(!a)return;const items=String(fd.get('items')).split('\n').map(x=>x.trim()).filter(Boolean),reason=String(fd.get('reason')).trim();if(!items.length||!reasonableText(reason)){modalError('Provide an actionable request and a meaningful reason.');return}a.notices.push({id:newID('NOTICE'),type:'Information request',items,note:reason,at:DB.clock,response:'',responded:false,evidence:[]});transition(a,'INFO_REQUIRED','Information requested',items.join(' / '));closeDialog();go('/applications/'+a.id+'?tab=notices');toast('Information request published.');return}
 if(id==='response-form'){const kind=fd.get('kind'),a=expectCase(fd,[kind==='finding'?'COMPLIANCE_PENDING':'INFO_REQUIRED'],'applicant');if(!a||a.owner!=='p1')return;if(pendingUpload){modalError('Wait for the browser-local file attachment to finish.');return}if(!reasonableText(fd.get('response'),8)||!dialogFiles.length){modalError('Provide a clear correction note and at least one sample or uploaded evidence file.');return}const item=kind==='finding'?a.findings.find(f=>f.id===fd.get('item')):a.notices.find(n=>n.id===fd.get('item'));if(!item)return;item.responses=item.responses||[];item.responses.push({revision:item.responses.length+1,note:String(fd.get('response')).trim(),evidence:clone(dialogFiles),at:DB.clock,actor:current().name});item.response=String(fd.get('response')).trim();item.evidence=clone(dialogFiles);if(kind==='finding')item.status='RESPONSE_RECEIVED';else{item.responded=true;item.accepted=false;const latest=a.documents.filter(d=>d.key==='ownership').length;const ev=clone(dialogFiles[0]);a.documents.push({...ev,key:'ownership',title:'Additional premises authorization',version:latest+1,scan:'CLEAN',size:ev.size||12000});}a.version++;event(a,'Applicant response received','A new correction response and evidence revision were submitted for '+item.id+'.');notify(a,'Response ready for review',a.name+' has submitted additional evidence.','supervisor');save();closeDialog();render();toast('Response recorded. The request is not automatically closed.');return}
 if(id==='verify-finding-form'){const a=expectCase(fd,['COMPLIANCE_PENDING','REVIEW_PENDING']);if(!a)return;const f=a.findings.find(f=>f.id===fd.get('finding'));if(!f)return;if(!reasonableText(fd.get('reason'),8)){modalError('Record the evidence and reason supporting this review.');return}if(fd.get('outcome')==='CLOSE'&&!f.evidence.length&&!(a.report?.revision>1&&a.report.items.some(r=>r.id===f.rule&&r.status==='PASS'))){modalError('Correction evidence or an accepted passing reinspection is required.');return}f.status=fd.get('outcome')==='CLOSE'?'VERIFIED_CLOSED':'OPEN';f.closure=String(fd.get('reason'));f.reviewedBy=current().name;f.reviewedAt=DB.clock;a.version++;event(a,f.status==='VERIFIED_CLOSED'?'Finding verified closed':'Finding returned for correction',f.title+'. '+f.closure);notify(a,'Finding review updated',f.title+': '+labelize(f.status));save();closeDialog();render();toast('Finding review recorded.');return}
 if(id==='decision-form'){const a=expectCase(fd,['REVIEW_PENDING']);if(!a||!staff('u-supervisor')?.active)return;const outcome=fd.get('outcome'),reason=String(fd.get('reason')).trim();if(!['APPROVE','DEFICIENCIES','REJECT'].includes(outcome)||!reasonableText(reason,12)||!fd.has('confirm')){modalError('Choose an outcome, provide a reason of at least 12 characters and confirm the evidence review.');return}if(outcome==='APPROVE'){const b=blockers(a);if(b.length){modalError('Favorable completion is blocked: '+b.join('; '));return}a.decision={id:newID('DECISION'),outcome:'APPROVE',reason,actor:current().name,actorId:current().id,at:DB.clock,version:a.version,evidenceReport:a.report.id,policy:a.profile,authority:'DEMO_CENTRAL_DECISION_V1'};transition(a,'APPROVED_PENDING_ISSUE','Favorable decision recorded',reason);let j=DB.jobs.find(j=>j.caseId===a.id);if(!j){j={id:newID('JOB'),caseId:a.id,decision:a.decision.id,type:'Certificate rendering',status:'READY',attempts:0,error:'Awaiting the demonstration renderer.',updated:DB.clock};DB.jobs.unshift(j)}save();closeDialog();go('/applications/'+a.id);toast('Decision accepted. Certificate publication is a separate job.');if(DB.settings.automaticJobs)setTimeout(()=>processJob(j),500);}
 else if(outcome==='DEFICIENCIES'){const failed=a.report.items.filter(r=>r.status==='FAIL'||r.status==='NOT_VERIFIED');const requests=failed.length?failed.map(r=>({rule:r.id,title:'Resolve '+(CHECKLIST.find(q=>q.id===r.id)?.label||r.id),description:r.note||reason})):reason.split('\n').map(x=>x.trim()).filter(Boolean).map((s,i)=>({rule:'MANUAL-'+(i+1),title:s,description:s}));requests.forEach(r=>{if(!a.findings.some(f=>f.rule===r.rule&&f.status!=='VERIFIED_CLOSED'))a.findings.push({id:newID('FINDING'),...r,status:'OPEN',response:'',evidence:[],raised:DB.clock,due:timeISO(now()+((DB.policies.find(p=>p.version===a.profile)||activePolicy()).targets.COMPLIANCE_PENDING||72)*3600000)});});a.notices.push({id:newID('NOTICE'),type:'Deficiency notice',items:requests.map(r=>r.title),note:reason,at:DB.clock});transition(a,'COMPLIANCE_PENDING','Deficiency notice issued',reason);closeDialog();go('/applications/'+a.id+'?tab=notices');toast('Itemized findings and a response obligation were recorded.');}
 else{a.decision={id:newID('DECISION'),outcome:'REJECT',reason,actor:current().name,at:DB.clock,version:a.version,evidenceReport:a.report?.id,policy:a.profile};transition(a,'REJECTED','Adverse decision recorded',reason);closeDialog();go('/applications/'+a.id);toast('Reasoned adverse outcome recorded. No certificate was generated.');}return}
 if(id==='failed-visit-form'){const a=expectCase(fd,['INSPECTION_PENDING'],'officer');if(!a||!canInspect(a))return;if(!reasonableText(fd.get('reason'),8)){modalError('Record the facts of the failed visit.');return}const op={id:newID('SYNC'),caseId:a.id,officer:DB.officer,baseVersion:a.version,type:'FAILED_VISIT',status:'QUEUED',created:DB.clock,payload:{reason:String(fd.get('type'))+': '+String(fd.get('reason'))},error:''};DB.sync.unshift(op);if(DB.settings.offline){save();closeDialog();go('/sync');toast('Failed visit queued locally. The accepted attempt is unchanged.');}else{const r=acceptOperation(op);closeDialog();go('/applications/'+a.id+'?tab=inspection');toast(r.ok?'Failed attempt recorded. A new scheduling action is required.':r.error,r.ok?'success':'error');}return}
 if(id==='escalation-form'){const a=readCase(fd.get('caseId')),o=a?.obligations.find(o=>o.id===fd.get('obligation'));if(!a||!o||!guard(canOperate()))return;if(!reasonableText(fd.get('reason'))){modalError('Record a reason for escalation.');return}if(o.escalated){modalError('An escalation already exists for this obligation.');return}o.escalated=true;DB.escalations.unshift({id:newID('ESC'),caseId:a.id,obligation:o.id,reason:String(fd.get('reason')),level:1,status:'OPEN',at:DB.clock,owner:'Duty supervisor'});audit('Manual escalation recorded',a.id,String(fd.get('reason')));save();closeDialog();render();toast('Escalation recorded without changing the case stage.');return}

 if(id==='export-form'){if(!reasonableText(fd.get('purpose'))){modalError('Record an export purpose.');return}const k=fd.get('kind');if(k==='cases'){const xs=filteredCases();csv('Agni_Setu_Applications_DEMO.csv',['Classification','Application','Premises','Category','Stage','Locality','Officer','Received (UTC)','Stage due (UTC)','Policy version','Report cutoff (UTC)'],xs.map(a=>['FICTIONAL DEMONSTRATION',a.id,a.name,a.category,a.state,a.locality,staff(a.officer)?.name||'Duty queue',a.receipt||'',stageObligation(a)?.due||'',a.profile,DB.clock]));}
 else if(k==='report'){if(!guard(['supervisor','leadership'].includes(DB.role)))return;csv('Agni_Setu_Report_DEMO.csv',['Classification','Application','Premises','Category','State','Received (UTC)','Closed (UTC)','Open','Overdue obligation','Reporting period days','Cutoff (UTC)','Policy'],reportCases().map(a=>['FICTIONAL DEMONSTRATION',a.id,a.name,a.category,a.state,a.receipt,a.closed||'',isOpen(a),overdue(a),reportPeriod,DB.clock,a.profile]));}
 else if(k==='audit'){if(!guard(['supervisor','leadership','admin','approver'].includes(DB.role)))return;csv('Agni_Setu_Audit_DEMO.csv',['Classification','Event ID','Action','Actor','Record','Timestamp (UTC)','Detail'],auditRows().map(x=>['FICTIONAL DEMONSTRATION',x.id,x.action,x.actor,x.caseId,x.at,DB.role==='admin'&&x.caseId?'Operational metadata only':x.detail]));}audit('Scoped export generated','','Type: '+k+'. Scope: '+current().short+'. Purpose: '+String(fd.get('purpose')));save();closeDialog();toast('Scoped CSV downloaded and export purpose recorded.');return}
 if(id==='invite-form'){if(!guard(canAdmin()))return;const name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim();if(!reasonableText(fd.get('reason'))){modalError('Record the provisioning reason.');return}if(DB.people.some(p=>p.email.toLowerCase()===email.toLowerCase())){modalError('A staff identity with this email already exists.');return}const p={id:newID('PERSON'),name,email,role:String(fd.get('role')),active:true,ward:'All pilot sectors',color:'blue',provisioningReason:String(fd.get('reason'))};DB.people.push(p);audit('Demo staff provisioned','',name+' / '+p.role+' / '+p.provisioningReason);save();closeDialog();render();toast('Demo staff identity created. No email was sent.');return}
 if(id==='policy-form'){const p=DB.policies.find(p=>p.version===Number(fd.get('version')));if(!guard(canAdmin()&&p?.status==='DRAFT'))return;const targets={};for(const s of Object.keys(p.targets)){targets[s]=Number(fd.get('target-'+s));if(!Number.isInteger(targets[s])||targets[s]<1||targets[s]>720){modalError('Targets must be whole calendar-hour values between 1 and 720.');return}}if(!reasonableText(fd.get('comment'),8)){modalError('Record a meaningful change rationale.');return}p.targets=targets;p.name=String(fd.get('name'));p.comment=String(fd.get('comment'));p.simulated=false;audit('Policy draft updated','','Demonstration policy v'+p.version);save();closeDialog();render();toast('Draft saved. Run the scenario checks before independent review.');return}
 if(id==='policy-approve-form'){const p=DB.policies.find(p=>p.version===Number(fd.get('version')));if(!guard(DB.role==='approver'&&p?.status==='IN_REVIEW'&&p.createdBy!==current().id&&p.simulated))return;const effective=Date.parse(fd.get('effective')+':00+05:30');if(!Number.isFinite(effective)||effective<now()-60000){modalError('Choose the current demo time or a future effective time.');return}if(!reasonableText(fd.get('reason'),8)){modalError('Record the independent approval reason.');return}p.effective=timeISO(effective);p.approvedBy=current().id;p.approvedAt=DB.clock;p.approvalReason=String(fd.get('reason'));p.status=effective<=now()?'PUBLISHED':'SCHEDULED';audit('Policy independently approved','', 'Demonstration policy v'+p.version+' / '+p.status);save();closeDialog();render();toast(p.status==='PUBLISHED'?'New submissions use the new policy. Existing cases are unchanged.':'Policy approved for scheduled activation.');return}
 if(id==='policy-return-form'){const p=DB.policies.find(p=>p.version===Number(fd.get('version')));if(!guard(DB.role==='approver'&&p?.status==='IN_REVIEW'))return;if(!reasonableText(fd.get('reason'))){modalError('Record a return reason.');return}p.status='DRAFT';p.simulated=false;p.returnReason=String(fd.get('reason'));p.comment+=' | Reviewer return: '+p.returnReason;audit('Policy returned to preparer','','v'+p.version+' / '+p.returnReason);save();closeDialog();render();toast('Policy returned for changes.');return}
 if(id==='ticket-form'){if(!reasonableText(fd.get('subject'),4)||!reasonableText(fd.get('message'),8)){modalError('Provide a clear subject and request description.');return}const caseId=String(fd.get('caseId')||'');if(caseId&&!readCase(caseId)){modalError('The selected case is outside your workspace.');return}if(fd.get('type')==='Demo appeal'&&!caseId){modalError('Select the application related to the demo appeal.');return}const t={id:newID('SUP'),caseId,owner:current().id,subject:String(fd.get('subject')),message:String(fd.get('message')),type:String(fd.get('type')),status:'OPEN',created:DB.clock,reply:''};DB.tickets.unshift(t);audit('Support request created',caseId,t.id+' / '+t.type);save();closeDialog();go('/support');toast('Support request recorded. No application decision was changed.');return}
 if(id==='ticket-update-form'){const t=DB.tickets.find(t=>t.id===fd.get('ticketId'));if(!guard(['admin','supervisor'].includes(DB.role)&&t))return;if(!reasonableText(fd.get('reply'),8)){modalError('Provide a clear support response.');return}t.reply=String(fd.get('reply'));t.status=String(fd.get('status'));t.repliedAt=DB.clock;audit('Support request updated',t.caseId,t.id+' / '+t.status);save();closeDialog();render();toast('Support response saved. The case outcome remains unchanged.');return}
 if(id==='withdraw-form'){const a=expectCase(fd,['SUBMITTED','SCRUTINY','INFO_REQUIRED','INSPECTION_PENDING','REVIEW_PENDING','COMPLIANCE_PENDING'],'applicant');if(!a||a.owner!=='p1')return;if(!reasonableText(fd.get('reason'),8)){modalError('Record a meaningful withdrawal reason.');return}a.withdrawal={requestedBy:current().name,reason:String(fd.get('reason')),at:DB.clock};a.attempts.forEach(t=>{if(['SCHEDULED','IN_PROGRESS'].includes(t.status)){t.status='CANCELLED';t.cancelReason='Application withdrawn.'}});transition(a,'WITHDRAWN','Withdrawal accepted',String(fd.get('reason')));closeDialog();render();toast('Demo application withdrawn. Evidence and the previous events are retained.');return}

async function handleUpload(input){const file=input.files?.[0];if(!file)return;pendingUpload=true;try{
 if(file.size>2*1024*1024)throw new Error('The prototype file limit is 2 MB. Choose a smaller PDF, JPG or PNG.');
 const ext=file.name.split('.').at(-1).toLowerCase(),bytes=new Uint8Array(await file.slice(0,8).arrayBuffer());const kind=bytes[0]===0x25&&bytes[1]===0x50&&bytes[2]===0x44&&bytes[3]===0x46?'application/pdf':bytes[0]===0xff&&bytes[1]===0xd8?'image/jpeg':bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47?'image/png':null;
 if(!kind||({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'})[ext]!==kind)throw new Error('Use a PDF, JPEG or PNG with matching file contents. This is only a format check, not a malware scan.');
 const id=newID('FILE'),blob=new Blob([file],{type:kind}),persistedFile=await putFile(id,blob),doc={id,name:file.name,mediaType:kind,sample:false,size:file.size,added:DB.clock,scan:'CLEAN',version:1,persistedFile};
 const target=input.dataset.upload;if(target==='draft'){if(DB.role!=='applicant'||!wizardDraft)return;const key=input.dataset.key,old=wizardDraft.documents.find(x=>x.key===key);Object.assign(doc,{key,title:DOCS[key],version:(old?.version||0)+1});wizardDraft.documents=wizardDraft.documents.filter(x=>x.key!==key);wizardDraft.documents.push(doc);persistDraft();render();}
 else if(target==='evidence'){const a=readCase(input.dataset.case);if(!canInspect(a))return;const d=ensureReport(a),item=d.items.find(i=>i.id===input.dataset.item);item.evidence.push(doc);d.savedAt=DB.clock;save();const y=scrollY;render();window.scrollTo(0,y);}
 else if(target==='response'){dialogFiles.push(doc);liveOutput(null,'modal-evidence-list',dialogFiles.map(e=>'<span class="evidence-chip">'+E(e.name)+'</span>').join(''));}
 toast(persistedFile?'File attached in this browser. Scan outcome is simulated.':'File attached for this session only. Browser file storage is unavailable.');
 }catch(e){toast(e.message,'error');if(activeDialog)modalError(e.message);}finally{pendingUpload=false;input.value='';}}
function updateReportProgress(id){const d=DB.localReports[id];if(!d)return;const done=d.items.filter(r=>r.status).length,t=document.getElementById('inspection-progress-text'),bar=document.getElementById('inspection-progress-bar');if(t)t.textContent=done+' / '+CHECKLIST.length;if(bar)bar.style.width=done/CHECKLIST.length*100+'%';}
function render(){const r=route(),p=r.parts[0]||'overview';let body='';document.title=(ROUTE_LABELS[p]||'Applicant services')+' | Agni Setu';
 if(p==='portal'){document.getElementById('app').innerHTML=portal();return}
 if(['login','register'].includes(p)){document.getElementById('app').innerHTML=loginPage(p==='register');return}
 if(DB.role==='public'&&p!=='verify'&&p!=='support'){document.getElementById('app').innerHTML=publicShell(heading('Sign in to continue','Private application records require a demonstration workspace.',link('Applicant sign in','/login','arrow','primary')));return}
 switch(p){
 case 'overview':body=DB.role==='officer'?inspectionQueue():DB.role==='approver'?policies():dashboard();break;
 case 'applications':body=r.parts[1]?detail(r.parts[1]):applications();break;
 case 'new':body=wizard();break;
 case 'inspections':body=['officer','supervisor'].includes(DB.role)?r.parts[1]?inspect(r.parts[1]):inspectionQueue():noAccess();break;

 case 'monitoring':body=monitoring();break;
 case 'certificates':body=['applicant','supervisor','leadership'].includes(DB.role)?certificates():noAccess();break;
 case 'certificate':body=certificateDetail(r.parts[1]);break;
 case 'verify':body=verifyPage();break;
 case 'reports':body=['supervisor','leadership'].includes(DB.role)?reports():noAccess();break;

 case 'team':body=team();break;
 case 'policies':body=policies();break;
 case 'operations':body=operations();break;
 case 'integrations':body=integrations();break;
 case 'notifications':body=notificationsPage();break;
 case 'sync':body=syncView();break;
 case 'premises':body=premises();break;
 case 'support':body=DB.role==='public'?heading('Service guidance','Common questions about this fictional application service.',link('Sign in for support','/login','arrow','primary'))+'<div class="card card-pad">'+FAQ.map(([q,a])=>'<details class="support-article"><summary>'+q+'</summary><p>'+a+'</p></details>').join('')+'</div>':support();break;
 case 'settings':body=settings();break;

 }
 document.getElementById('app').innerHTML=DB.role==='public'?publicShell(body):shell(body);

function onRoute(){const r=route(),next=location.hash;closeDialog();mobileOpen=false;if(r.path==='/applications'&&next!==lastRoute){tableState=r.q.get('state')||'all';tableUrgency=r.q.get('urgency')||'all';page=1;tableQuery='';}if(r.path==='/new'&&next!==lastRoute&&r.q.has('renew')){wizardDraft=null;DB.workingDraft=null;wizardStep=0;}lastRoute=next;render();window.scrollTo(0,0);}
document.addEventListener('click',async e=>{const skip=e.target.closest('a.skip');if(skip){e.preventDefault();document.getElementById('main')?.focus();return}if(e.target.id==='dialog-overlay'){closeDialog();return}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(fn){e.preventDefault();try{await fn(el)}catch(error){console.error('Prototype action failed:',el.dataset.action,error);toast('This action could not finish. Your accepted local data has been retained.','error')}}else console.error('Missing action handler',el.dataset.action);});
document.addEventListener('submit',async e=>{e.preventDefault();try{await submitForm(e.target)}catch(error){console.error('Form command failed',e.target.id,error);if(activeDialog)modalError('The action could not finish. Review the latest record and retry.');else toast('The action could not finish. Your local data has been retained.','error')}});

 if(el.dataset.reportSummary){const d=DB.localReports[el.dataset.reportSummary];if(d){d.summary=el.value;d.savedAt=DB.clock;save();}}

document.addEventListener('change',async e=>{const el=e.target;

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(DB.role!=='public')openSearch();return}if(e.key==='Escape'){if(activeDialog)closeDialog();else if(mobileOpen){mobileOpen=false;render()}return}if(activeDialog){const d=document.querySelector('.dialog');if(e.key==='Tab'&&d){const focus=[...d.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled])')].filter(el=>el.offsetParent!==null);if(!focus.length)return;const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(activeDialog==='Search your workspace'){const links=[...d.querySelectorAll('.search-result')],idx=links.indexOf(document.activeElement);if(e.key==='ArrowDown'&&links.length){e.preventDefault();links[Math.min(idx+1,links.length-1)].focus()}if(e.key==='ArrowUp'){e.preventDefault();if(idx>0)links[idx-1].focus();else document.getElementById('global-search')?.focus()}if(e.key==='Enter'&&document.activeElement.id==='global-search'&&links.length){e.preventDefault();links[0].click();}}}});
