# Agni Setu web server: static SPA + same-origin /api reverse proxy (architecture s.3).
# Runs unprivileged on 8080 inside the container; Compose publishes it on 127.0.0.1:${WEB_HOST_PORT}.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers are included per static location (see security-headers.conf); the /api/
    # location deliberately has none so Django's SecurityMiddleware headers are not duplicated.
    # Resolve the api service through Docker's embedded DNS on every request (valid=10s) so a
    # recreated api container with a new address is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        # Django's SecurityMiddleware sets the security headers on API responses; do not duplicate.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host keeps the port so Django builds correct absolute URLs (OIDC redirect_uri).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location /assets/ {
        include /etc/nginx/agni/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/agni/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Service worker and its workbox runtime (B11): always revalidated so a new release is
    # detected on the next visit; the worker itself caches only the static shell.
    location ~ ^/(sw|workbox-[a-z0-9]+)\.js$ {
        include /etc/nginx/agni/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/agni/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/agni/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
