# Included in every location: nginx `add_header` directives in a location replace the parent's,
# so the security headers must be re-declared wherever another add_header appears.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Content Security Policy (security s.4): project assets only; scripts are external Vite
# bundles (no inline scripts); `style-src 'unsafe-inline'` covers framework-managed inline
# style attributes only (no inline <style> or user HTML is ever rendered); images may be data:
# / blob: for QR codes and PWA icons; API and service worker stay same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
